# The pipeline. `dvc repro` runs every stage whose deps or params changed.
# Each stage is `uv run python -m tripduration.<stage>`; I/O lives at the
# stage entry point, logic in importable functions with tests.

stages:
  validate:
    desc: Normalise raw months to the canonical schema and apply ADR-0002 validity rules
    cmd: uv run python -m tripduration.validate
    deps:
      - src/tripduration/validate.py
      - src/tripduration/ingest.py
      - src/tripduration/config.py
      - configs/schema_raw.yaml
      - data/raw/yellow
    params:
      - data
      - validity
    outs:
      - data/validated
      - reports/validation:
          cache: false        # small JSON; lives in git so `git log` shows counts

  quality:
    desc: Data-quality report and acceptance rules; a failure stops the pipeline before train
    cmd: uv run python -m tripduration.quality
    deps:
      - src/tripduration/quality.py
      - src/tripduration/validate.py
      - src/tripduration/ingest.py
      - src/tripduration/config.py
      - configs/schema_raw.yaml
      - data/raw/yellow
      - data/validated
    params:
      - data
      - validity
      - quality
    outs:
      - reports/quality:
          cache: false

  prepare:
    desc: Derive ADR-0003 splits from validated months and build ADR-0005 features
    cmd: uv run python -m tripduration.prepare
    deps:
      - src/tripduration/prepare.py
      - src/tripduration/features.py
      - src/tripduration/schema.py
      - src/tripduration/config.py
      - configs/holidays.csv
      - data/reference/zone_centroids.csv
      - data/validated
      - reports/quality        # prepare only runs when the acceptance rules passed
    params:
      - seed
      - split
    outs:
      - data/processed
      - reports/prepare.json:
          cache: false

  train:
    desc: Fit the fallback lookup table and the model on training months; log an MLflow run
    cmd: uv run python -m tripduration.train
    deps:
      - src/tripduration/train.py
      - src/tripduration/fallback.py
      - src/tripduration/features.py
      - src/tripduration/config.py
      - configs/holidays.csv
      - data/reference/zone_centroids.csv
      - data/processed/train.parquet
      - data/processed/val.parquet
      - reports/prepare.json
    params:
      - seed
      - n_threads
      - fallback
      - model
      - mlflow
    outs:
      - models/model.pkl
      - models/fallback_table.parquet
      - models/model_meta.json:
          cache: false

  evaluate:
    desc: Model and fallback metrics on validation and test months; MAE by hour and borough pair
    cmd: uv run python -m tripduration.evaluate
    deps:
      - src/tripduration/evaluate.py
      - src/tripduration/fallback.py
      - src/tripduration/features.py
      - configs/holidays.csv
      - data/reference/zone_centroids.csv
      - data/processed/val.parquet
      - data/processed/test.parquet
      - models/model.pkl
      - models/fallback_table.parquet
      - models/model_meta.json
    metrics:
      - metrics/eval.json:
          cache: false
    outs:
      - reports/eval:
          cache: false
