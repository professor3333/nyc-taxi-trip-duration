# Every knob the pipeline reads. `dvc params diff` compares two commits.

seed: 42
n_threads: 4

data:
  service: yellow
  raw_dir: data/raw/yellow
  validated_dir: data/validated
  reference_dir: data/reference
  timezone: America/New_York

split:                      # ADR-0003
  start_month: "2024-10"    # anchor of the contiguous month sequence M
  train_window_max: 6       # expanding warm-up, then rolling
  train_sample_frac: 1.0    # changing this is a recorded decision

validity:                   # ADR-0002 — every rule here has a rejection counter
  zone_min: 1
  zone_max: 263             # 264 = Unknown, 265 = Outside NYC: the API rejects both
  min_duration_s: 60
  max_duration_min: 180
  dst_window_hours: 3       # drop trips touching [00:00, 03:00) local on a DST transition day
  dedupe_key:               # identity of a trip; no post-trip column
    - vendor_id
    - tpep_pickup_datetime
    - tpep_dropoff_datetime
    - pu_location_id
    - do_location_id

fallback:                   # ADR-0006 — zone-pair median lookup table (baseline + degraded path)
  hour_bucket_edges: [0, 6, 10, 16, 20, 24]
  min_count: 5              # cells with fewer training trips fall through to the next level

model:                      # ADR-0006 — sklearn HistGradientBoostingRegressor
  loss: absolute_error      # the primary metric is MAE
  max_iter: 300
  learning_rate: 0.1
  max_leaf_nodes: 63
  min_samples_leaf: 200
  l2_regularization: 1.0
  max_bins: 255

mlflow:
  experiment: nyc-taxi-trip-duration

api:                        # ADR-0009 — accepted departure_time window (inclusive, New York local)
  departure_min: "2024-01-01"
  departure_max: "2027-12-31"
  max_batch: 100
  max_body_bytes: 32768       # 413 before JSON parsing; a full batch is ~12 KB
  predict_workers: 1          # predictions run off the event loop, one at a time (ADR-0012)

promotion:                  # ADR-0007 amendment - read by gate_candidate.py and promote.py, not a stage
  min_relative_improvement: 0.01   # candidate MAE at least 1% below the champion's on the same month
  confidence: 0.95                 # ...and the day-block bootstrap's lower bound above zero
  bootstrap_resamples: 2000
  slice_min_n: 2000                # slices smaller than this are reported, not gated
  slice_max_regression: 0.03       # no gated slice may be more than 3% worse
  gated_families: [period, airport, borough_pair, route]

monitoring:                 # ADR-0011 — prospective evaluation of the champion on each new month
  mae_degradation_ratio: 1.15   # alert when prospective MAE > promotion-time test MAE x this

quality:                    # acceptance rules; any failure stops the pipeline before training
  min_rows_raw: 1000000     # a real month is 3.4-3.9M rows; far less means a truncated download
  min_rows_valid: 500000
  max_reject_rate: 0.10     # ADR-0002 removes ~3.8%; 10% means something changed
  max_null_rate:             # per canonical column, on the raw month
    tpep_pickup_datetime: 0.0
    tpep_dropoff_datetime: 0.0
    pu_location_id: 0.0
    do_location_id: 0.0
    passenger_count: 0.40   # null on app-dispatched trips (request_source set): 25-30% in 2025-26; not a feature
  duration_p50_bounds: [5.0, 30.0]    # median trip, minutes
  duration_p99_bounds: [30.0, 180.0]
  max_share_single_zone_pair: 0.05    # one pair dominating means a broken join or a test file
