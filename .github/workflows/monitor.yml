name: monitor

# Daily: the live service must be up, not degraded, and serving the champion
# version main says it should. Opens (or updates) one issue labelled
# `service-health` on failure and closes it when healthy again.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read     # freshness.py reads retrain.yml's job results
  id-token: write   # the Function URL uses AWS_IAM auth (ADR-0008 amendment)

# Explicit `shell: bash` runs steps with `-eo pipefail`. The implicit default
# is `bash -e`, where `cmd | tee log` reports tee's status and a failing cmd
# passes (tests/test_workflows.py).
defaults:
  run:
    shell: bash

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      # In alias mode (deploy.yml) callers are served by the `live` alias;
      # the unqualified function ($LATEST) may hold a rejected candidate.
      TARGET: ${{ secrets.LAMBDA_FUNCTION_NAME }}${{ vars.RELEASE_MODE == 'alias' && ':live' || '' }}
      URL_QUALIFIER: ${{ vars.RELEASE_MODE == 'alias' && 'live' || '' }}
      # releases/live.json (ADR-0014) needs the ADR-0013 monitor role.
      LEDGER: ${{ secrets.AWS_MONITOR_ROLE_ARN != '' }}
      BUCKET: ${{ secrets.S3_BUCKET }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --group train -q   # boto3, for SigV4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_MONITOR_ROLE_ARN || secrets.AWS_ROLE_ARN }}   # fallback: legacy role until iam.sh migration (runbook)
          aws-region: ${{ secrets.AWS_REGION }}

      # The selected champion (champion.json) and the deployed release
      # (releases/live.json) are different facts: a promotion moves the first,
      # only a successful deploy moves the second. The check below requires the
      # service to report the release the ledger says is deployed.
      #
      # Health is decided from step *outcomes* (below), never from flags a
      # step writes on its own failure path: with continue-on-error a step's
      # `outcome` is `failure` however it failed (a failed AWS call before
      # the check, a crash), while its `conclusion` is `success`.
      - name: Selected champion vs deployed release
        id: ledger
        if: env.LEDGER == 'true'
        continue-on-error: true
        run: |
          uv run python scripts/releases.py status --bucket "$BUCKET" | tee -a "$GITHUB_STEP_SUMMARY"
          # Empty only when nothing is recorded yet (ledger not seeded); an
          # unreadable ledger fails this step, and so the health decision.
          RID=$(uv run python scripts/releases.py live-id --bucket "$BUCKET")
          echo "EXPECT_RELEASE=$RID" >> "$GITHUB_ENV"

      - name: Check the live service
        id: check
        continue-on-error: true
        run: |
          uv run python scripts/deploy_check.py --invoke "$TARGET" \
            --expect-version "v$(jq -r .version models/champion.json)" \
            ${EXPECT_RELEASE:+--expect-release "$EXPECT_RELEASE"} \
            --expect-fixture models/champion_fixture.csv --malformed 2>&1 | tee check.txt

      # The endpoint callers actually use: an HTTP request to the Function URL,
      # SigV4-signed as this (non-root) role. The Lambda-API check above
      # proves the service; this one proves the URL edge and its auth.
      - name: Check the Function URL over HTTP
        id: url
        continue-on-error: true
        env:
          FN: ${{ secrets.LAMBDA_FUNCTION_NAME }}
        run: |
          # Any failure in this step - resolving the URL included - fails it,
          # and its outcome is what the issue logic reads.
          if ! URL=$(aws lambda get-function-url-config --function-name "$FN" \
              ${URL_QUALIFIER:+--qualifier "$URL_QUALIFIER"} --query FunctionUrl --output text 2>&1); then
            echo "FAIL  Function URL configuration unreadable: $URL" | tee -a check.txt
            exit 1
          fi
          # End to end from outside AWS: 10 warm /predict calls over the real
          # network path, p95 enforced and published as E2ELatencyMs.
          uv run python scripts/deploy_check.py --url "$URL" --sigv4 \
            --expect-version "v$(jq -r .version models/champion.json)" \
            ${EXPECT_RELEASE:+--expect-release "$EXPECT_RELEASE"} \
            --expect-fixture models/champion_fixture.csv --malformed \
            --latency-samples 10 --publish-metrics monitor 2>&1 | tee -a check.txt

      # Unhealthy unless every check explicitly succeeded: failure, skipped
      # and cancelled all count. The ledger step counts only where it runs.
      - name: Open or update issue
        if: >-
          always() && (steps.check.outcome != 'success' || steps.url.outcome != 'success'
          || (env.LEDGER == 'true' && steps.ledger.outcome != 'success'))
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK: ${{ steps.check.outcome }}
          URL_CHECK: ${{ steps.url.outcome }}
          LEDGER_CHECK: ${{ steps.ledger.outcome }}
        run: |
          {
            echo "Service check failed on $(date -u +%FT%TZ):"
            echo
            echo "| check | outcome |"
            echo "|---|---|"
            echo "| Lambda API (\`deploy_check --invoke\`) | $CHECK |"
            echo "| Function URL over HTTP | $URL_CHECK |"
            echo "| deployed release (ledger) | ${LEDGER_CHECK:-not run} |"
            echo; echo '```'; cat check.txt 2>/dev/null || echo "(no check output)"; echo '```'
            echo; echo "Runbook: docs/runbook.md#service-down-or-degraded"
          } > body.md
          N=$(gh issue list --label service-health --state open --json number -q '.[0].number')
          if [ -n "$N" ]; then gh issue comment "$N" --body-file body.md
          else gh issue create --title "Service unhealthy" --body-file body.md --label service-health \
            || gh issue create --title "Service unhealthy" --body-file body.md; fi
          exit 1

      # The service can be healthy while nothing behind it advances.
      # Runs even when the service check failed; staleness is reported in its
      # own issue and does not turn the run red (the issue is the alert).
      - name: Freshness (data age, model age, last successful retrain)
        id: fresh
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python scripts/freshness.py --json freshness.json 2>&1 | tee fresh.txt \
            || echo "stale=true" >> "$GITHUB_OUTPUT"

      - name: Open, update or close the freshness issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STALE: ${{ steps.fresh.outputs.stale }}
        run: |
          N=$(gh issue list --label freshness --state open --json number -q '.[0].number')
          if [ "$STALE" = "true" ]; then
            { echo "Freshness check on $(date -u +%FT%TZ):"; echo; echo '```'; cat fresh.txt; echo '```'
              echo; echo "Thresholds: ADR-0011. Runbook: docs/runbook.md#stale-data-or-model"; } > fresh.md
            if [ -n "$N" ]; then gh issue comment "$N" --body-file fresh.md
            else gh label create freshness --color d93f0b --force >/dev/null
                 gh issue create --title "Data or model is stale" --body-file fresh.md --label freshness; fi
          elif [ -n "$N" ]; then
            gh issue close "$N" --comment "Fresh again on $(date -u +%FT%TZ)."
          fi

      # Only after BOTH service checks (and the ledger read, where it runs)
      # explicitly succeeded in this run.
      - name: Close issue when healthy
        if: >-
          always() && steps.check.outcome == 'success' && steps.url.outcome == 'success'
          && (env.LEDGER != 'true' || steps.ledger.outcome == 'success')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for N in $(gh issue list --label service-health --state open --json number -q '.[].number'); do
            gh issue close "$N" --comment "Healthy again on $(date -u +%FT%TZ)."
          done
