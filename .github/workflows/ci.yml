name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Explicit `shell: bash` runs steps with `-eo pipefail`. The implicit default
# is `bash -e`, where `cmd | tee log` reports tee's status and a failing cmd
# passes (tests/test_workflows.py).
defaults:
  run:
    shell: bash

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install locked environment
        run: make setup

      - name: Lint (ruff check, ruff format --check, mypy)
        run: make lint

      # Shell scripts deploy real infrastructure and workflows run with cloud
      # credentials; a quoting bug in either is found here, not in production.
      - name: Shell and workflow lint (shellcheck, actionlint)
        run: |
          shellcheck --version | head -2
          shellcheck deploy/aws/*.sh scripts/*.sh
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -no-color

      - name: Dependency vulnerability audit (runtime strict, other groups vs accepted list)
        run: scripts/audit.sh

      # Called out separately because it is the check that matters most: the
      # offline pipeline and POST /predict must agree to 1e-9 on the same
      # rows, and the API must refuse a model whose feature list differs.
      - name: Training/inference feature consistency
        run: |
          uv run pytest -q \
            tests/test_api.py::test_parity_offline_pipeline_vs_api \
            tests/test_api.py::test_feature_list_mismatch_refuses_model \
            tests/test_prepare.py::test_run_end_to_end_drops_post_trip_columns

      - name: Data-transformation and API tests
        run: make test

      - name: Train on the fixture months (no full data, no network)
        run: uv run pytest -q tests/test_pipeline.py

      # The committed dvc.yaml, executed: every stage's own command, a fresh
      # environment from uv.lock, quality blocking and exact invalidation.
      - name: Actual DVC graph on the fixture months (dvc repro)
        run: uv run pytest -q -m slow tests/test_dvc_repro.py

      # The canonical training environment (Dockerfile `train` target) must
      # build and run the pipeline, or the scheduled retrain breaks unseen.
      - name: Fixture pipeline in the canonical training environment
        run: |
          TRAIN_ENV_NETWORK=none scripts/train_env.sh \
            uv run --locked pytest -q -p no:cacheprovider tests/test_pipeline.py

      # The image needs model artefacts. CI has no DVC remote, so it trains a
      # tiny model from the fixture months into build/ci-models and bakes that.
      # This proves the Dockerfile and the serving path, not the model quality.
      - name: Train fixture model for the container smoke
        run: uv run python scripts/ci_fixture_model.py --out build/ci-models

      - name: Docker build
        run: |
          docker build \
            --build-arg MODELS_SRC=build/ci-models \
            --build-arg REFERENCE_SRC=tests/fixtures \
            --build-arg GIT_SHA=${{ github.sha }} \
            --build-arg MODEL_VERSION=ci \
            -t tripduration:ci .

      # The image that would ship: OS packages and Python wheels. Fails on any
      # CRITICAL/HIGH finding that has a fix (an unfixed one cannot be acted on,
      # and is reported by ECR scan-on-push). deploy.yml runs the same gate on
      # the release image before Lambda is touched.
      - name: Image vulnerability scan (trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --quiet --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 tripduration:ci

      - name: Container smoke (/health, /ready, /predict, malformed -> 422)
        run: |
          docker run -d --name api -p 8080:8080 tripduration:ci
          for _ in $(seq 1 30); do curl -sf localhost:8080/health && break; sleep 1; done
          uv run python scripts/deploy_check.py --url http://localhost:8080 --malformed --models-dir build/ci-models --reference-dir tests/fixtures
          docker logs api | tail -5
          docker rm -f api

      # --cold must prove the first request met a fresh process, and must
      # refuse a warm one. Readiness is read from the log, never over HTTP,
      # so no request reaches the new process before the measured one.
      - name: Cold-start check (positive and negative)
        run: |
          docker run -d --name cold -p 8080:8080 tripduration:ci
          for _ in $(seq 1 60); do docker logs cold 2>&1 | grep -q "Application startup complete" && break; sleep 1; done
          uv run python scripts/deploy_check.py --url http://localhost:8080 --cold --latency-samples 5 --evidence cold.json
          jq -e '.cold.body.requests_before == 0' cold.json
          if uv run python scripts/deploy_check.py --url http://localhost:8080 --cold > warm.txt; then
            echo "::error::--cold passed against a warm process"; cat warm.txt; exit 1
          fi
          grep -q "FAIL  cold: fresh process" warm.txt
          docker rm -f cold

      # Backup and restore of the registry, for real: Postgres + MLflow from
      # compose.yaml, two versions with aliases, backup, restore into a
      # scratch project, compare. The negative control must fail on the
      # alias mismatch specifically - a restore that merely failed to start
      # would also exit 1 and prove nothing (observed locally: an OOM).
      - name: Registry backup and restore drill
        env:
          MLFLOW_PORT: "5098"
          API_PORT: "8098"
        run: |
          docker compose -p drill-src up -d --wait postgres mlflow
          uv run python scripts/seed_registry.py --models build/ci-models --tracking-uri http://localhost:5098
          uv run python scripts/registry_backup.py --project drill-src --tracking-uri http://localhost:5098 --out-dir drill
          docker compose -p drill-src down -v
          B=$(find drill -mindepth 1 -maxdepth 1 -type d | head -1)
          uv run python scripts/registry_restore.py --from "$B" --check
          cp -r "$B" tampered
          jq '.state.aliases.champion = "1"' "$B/manifest.json" > tampered/manifest.json
          if uv run python scripts/registry_restore.py --from tampered --check > tampered.txt 2>&1; then
            echo "::error::a tampered backup verified"; cat tampered.txt; exit 1
          fi
          grep -q "FAIL aliases" tampered.txt || { echo "::error::tampered restore failed for another reason"; cat tampered.txt; exit 1; }

