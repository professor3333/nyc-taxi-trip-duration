name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The default token can only read the repo; nothing in CI needs to write.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # setup-uv reads .python-version and installs that interpreter.
      - name: Install locked environment
        run: make setup

      - name: Lint
        run: make lint

      - name: Test
        run: make test
