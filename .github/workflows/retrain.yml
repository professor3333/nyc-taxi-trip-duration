name: retrain

# Weekly: check whether TLC has published the next month. Two jobs:
#
#   plan  - read-only (contents/pull-requests: read, no AWS role). Works out the
#           month, whether it is published, whether it is already on main or
#           in an open candidate PR, which unmerged candidate data to carry,
#           and whether to train. scripts/retrain_plan.py holds the logic and
#           is unit-tested; this file only wires its outputs.
#   train - runs only when plan says should_train=true: ingest, repro with the
#           ADR-0003 window, prospective evaluation of the champion, the
#           ADR-0007 gate, and a labelled candidate PR (created or updated).
#
# Accepting a month's DATA and promoting its MODEL are separate decisions
# (ADR-0010 amendment 2026-09-23). An open candidate's data is carried into the
# next month's candidate unless the PR is labelled `data-rejected`; a failed
# gate or a `model-rejected` label only means "do not promote". Registering and
# promoting stay human because the registry is local (ADR-0004, ADR-0010).

on:
  schedule:
    # TLC publishes monthly with roughly a two-month lag, but not on a fixed
    # day. Checking weekly finds a new month within days; a week with nothing
    # new costs one HEAD request and exits green.
    - cron: "0 9 * * 1"   # Mondays, 09:00 UTC
  workflow_dispatch:
    inputs:
      month:
        description: "YYYY-MM (default: the month after main + open candidates)"
        required: false
      check_only:
        description: "Only plan: report publication and what would happen; never ingest, train or push"
        type: boolean
        default: false
      rebuild:
        description: "Retrain a month that already has an open candidate PR, replacing its branch"
        type: boolean
        default: false

# One retrain at a time. Two runs would race on the same branch, the same DVC
# remote and the same dvc.lock. cancel-in-progress: false keeps the running
# one alive, but GitHub holds only ONE pending run per group: a third run
# cancels the pending second (observed: run 35813964651). That is safe here
# because plan derives everything from current state - the surviving run
# picks up the next month itself - but a dispatched *specific* month can be
# dropped and must be re-dispatched.
concurrency:
  group: retrain
  cancel-in-progress: false

permissions: {}

# Explicit `shell: bash` runs steps with `-eo pipefail`. The implicit default
# is `bash -e`, where `cmd | tee log` reports tee's status and a failing cmd
# passes (tests/test_workflows.py).
defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      month: ${{ steps.plan.outputs.month }}
      published: ${{ steps.plan.outputs.published }}
      already_ingested: ${{ steps.plan.outputs.already_ingested }}
      candidate_pr: ${{ steps.plan.outputs.candidate_pr }}
      carry: ${{ steps.plan.outputs.carry }}
      carry_prs: ${{ steps.plan.outputs.carry_prs }}
      lease: ${{ steps.plan.outputs.lease }}
      should_train: ${{ steps.plan.outputs.should_train }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Read candidate PRs and branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --state open --limit 200 \
            --json number,headRefName,headRefOid,labels > prs.json
          git ls-remote --heads origin 'refs/heads/retrain/*' > branches.txt
          echo "open retrain PRs: $(jq -c '[.[] | select(.headRefName | startswith("retrain/")) | {n: .number, b: .headRefName, l: [.labels[].name]}]' prs.json)"

      - name: Plan (HEAD request only)
        id: plan
        env:
          MONTH: ${{ inputs.month }}
          CHECK_ONLY: ${{ inputs.check_only }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          ARGS=(--prs prs.json --branches branches.txt --month "$MONTH")
          [ "$CHECK_ONLY" = "true" ] && ARGS+=(--check-only)
          [ "$REBUILD" = "true" ] && ARGS+=(--rebuild)
          uv run --frozen --no-dev --no-group train python scripts/retrain_plan.py "${ARGS[@]}" | tee plan.txt

      - name: Report the plan
        env:
          CHECK_ONLY: ${{ inputs.check_only }}
        run: |
          {
            echo "### Retrain plan"
            echo; grep '^reason=' plan.txt | cut -d= -f2-
            echo; echo '```'; grep -v '^reason=' plan.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # A dispatch that would leave a gap is a mistake worth a red run;
          # a check-only run reports it and stays green.
          if grep -qx 'gap=true' plan.txt && [ "$CHECK_ONLY" != "true" ]; then
            echo "::error::$(grep '^reason=' plan.txt | cut -d= -f2-)"
            exit 1
          fi

  train:
    needs: plan
    if: needs.plan.outputs.should_train == 'true'
    runs-on: ubuntu-latest
    # The OIDC subject becomes environment:retrain, the only one the retrain
    # role trusts; the environment only admits protected branches (main).
    environment: retrain
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read    # find the candidate PR's ci run
    env:
      MLFLOW_TRACKING_URI: sqlite:///ci-mlflow.db   # throwaway; the real registry is local (ADR-0004)
      MLFLOW_DISABLE_AGENT_HINT: "1"
      M: ${{ needs.plan.outputs.month }}
      CARRY: ${{ needs.plan.outputs.carry }}
      CARRY_PRS: ${{ needs.plan.outputs.carry_prs }}
      CANDIDATE_PR: ${{ needs.plan.outputs.candidate_pr }}
      LEASE: ${{ needs.plan.outputs.lease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: make setup
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_RETRAIN_ROLE_ARN || secrets.AWS_ROLE_ARN }}   # fallback: legacy role until iam.sh migration (runbook)
          aws-region: ${{ secrets.AWS_REGION }}

      # Only the pointer and the ingest report: the bytes are already in the
      # DVC remote (that candidate's run pushed them), and nothing else from
      # an older candidate branch - code, params, outputs - is taken.
      - name: Carry accepted data from open candidates
        if: env.CARRY != ''
        run: |
          for c in $CARRY; do
            git fetch -q origin "retrain/$c"
            git checkout FETCH_HEAD -- "data/raw/yellow/$c.parquet.dvc" "reports/ingest/yellow-$c.json"
            echo "carried $c from retrain/$c"
          done

      - name: Ingest
        run: |
          make ingest MONTH="$M"
          if [ ! -f "data/raw/yellow/$M.parquet" ]; then
            echo "::error::plan saw $M published, but ingest produced no file"
            exit 1
          fi

      - name: dvc pull, add, repro, push
        run: |
          uv run dvc pull -q
          for c in $CARRY $M; do uv run dvc add -q "data/raw/yellow/$c.parquet"; done
          # Train and evaluate where the model will serve: the Dockerfile's
          # `train` target (serving image's pinned base, linux/amd64).
          scripts/train_env.sh uv run --locked dvc repro
          uv run dvc push -q

      # The tracking store is SQLite on this runner and dies with it. The
      # exported record (params, metric history, tags, artifact md5s) is
      # committed with the candidate and linked by register.py; the raw store
      # is kept as a run artifact for 90 days.
      - name: Export the training run
        run: scripts/train_env.sh uv run --locked python scripts/export_run.py

      - name: Keep the raw tracking store
        uses: actions/upload-artifact@v4
        with:
          name: tracking-${{ env.M }}
          path: |
            ci-mlflow.db
            mlruns/
          retention-days: 90
          if-no-files-found: error

      - name: Prospective evaluation of the champion
        id: prospective
        run: |
          uv run python scripts/fetch_champion.py
          scripts/train_env.sh uv run --locked python scripts/prospective_eval.py --month "$M" | tee prospective.txt
          echo "verdict=$(jq -r .verdict "reports/monitoring/$M.json")" >> "$GITHUB_OUTPUT"

      - name: Gate the candidate against the champion on the same month
        id: gate
        run: |
          uv run python scripts/gate_candidate.py --month "$M" | tee gate.txt
          case "$(jq -r .verdict "reports/monitoring/gate-$M.json")" in
            pass) echo "label=candidate-passed" >> "$GITHUB_OUTPUT" ;;
            *)    echo "label=candidate-failed" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Push the candidate branch
        run: |
          git config user.name "Niroj33"
          git config user.email "86530493+professor3333@users.noreply.github.com"
          git switch -C "retrain/$M"
          git add data/raw/yellow/ dvc.lock metrics/ reports/ models/model_meta.json
          git commit -m "Retrain candidate $M"
          if [ -n "$LEASE" ]; then
            # Replace the existing branch only if it is still the commit plan
            # saw; anything pushed since then makes this fail, not vanish.
            git push --force-with-lease="retrain/$M:$LEASE" origin "retrain/$M"
          else
            git push origin "retrain/$M"
          fi

      - name: Open or update the candidate PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ steps.gate.outputs.label }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create retrain --color 0e8a16 --description "Candidate produced by the scheduled retrain" --force
          gh label create candidate-passed --color 0e8a16 --description "ADR-0007 gate passed on the same month" --force
          gh label create candidate-failed --color d93f0b --description "ADR-0007 gate failed: do not promote (data may still be accepted)" --force
          gh label create model-rejected --color d93f0b --description "Owner declined to promote this model; its data is still carried forward" --force
          gh label create data-rejected --color b60205 --description "This month's data must not be used; later months wait" --force
          {
            echo "## Retrain candidate $M"
            echo; echo "Split: $(jq -c .split reports/prepare.json)"
            if [ -n "$CARRY" ]; then
              echo; echo "Carries unmerged accepted data: $CARRY (from open PR(s) $(for n in $CARRY_PRS; do printf '#%s ' "$n"; done))."
            fi
            echo; echo "### Two separate decisions"
            echo "- **Accept the data:** approve the held \`ci\` run (\`make candidate-ci BRANCH=retrain/$M\`), then merge this PR. It updates main's data and pipeline outputs; it never changes what is served."
            echo "- **Promote the model:** \`make register\` then \`make promote VERSION=<n> REASON=...\` (ADR-0010). To decline, label \`model-rejected\` and merge anyway if the data is sound."
            echo "- Label \`data-rejected\` only if this month's data is wrong: later months then wait for it."
            echo; echo "### Candidate vs fallback"; echo
            echo '```'; jq '{val: {model: .val.model.mae, fallback: .val.fallback.mae}, test: {month: .test.month, model: .test.model.mae, fallback: .test.fallback.mae}}' metrics/eval.json; echo '```'
            echo "### Champion prospective on $M"; echo; echo '```'; cat prospective.txt; echo '```'
            echo "### Gate verdict (ADR-0007)"; echo; echo '```'; cat gate.txt; echo '```'
            echo "### dvc metrics diff main"; echo; echo '```'; uv run dvc metrics diff main --md || true; echo '```'
            echo; echo "Built by $RUN_URL"
          } > body.md
          TITLE="Retrain candidate $M (${LABEL#candidate-})"
          if [ -n "$CANDIDATE_PR" ]; then
            # REST, not `gh pr edit`: on this repo that fails with a GraphQL
            # "Projects (classic) is being deprecated" error.
            gh api -X PATCH "repos/{owner}/{repo}/pulls/$CANDIDATE_PR" \
              -f title="$TITLE" -F body=@body.md --silent
            for old in candidate-passed candidate-failed; do
              gh api -X DELETE "repos/{owner}/{repo}/issues/$CANDIDATE_PR/labels/$old" --silent 2>/dev/null || true
            done
            gh api "repos/{owner}/{repo}/issues/$CANDIDATE_PR/labels" \
              -f "labels[]=retrain" -f "labels[]=$LABEL" --silent
            gh pr comment "$CANDIDATE_PR" --body "Rebuilt in place by $RUN_URL (gate: ${LABEL#candidate-})."
            PR="$CANDIDATE_PR"
          else
            gh pr create --head "retrain/$M" --title "$TITLE" --body-file body.md \
              --label retrain --label "$LABEL"
            PR=$(gh pr view "retrain/$M" --json number -q .number)
          fi
          # GitHub holds this PR's `ci` run at action_required because a bot
          # opened it; a human approves it as part of accepting the data
          # (docs/runbook.md). A dispatched ci run does NOT count: its check
          # suite is not linked to the PR, so branch protection ignores it.
          for n in $CARRY_PRS; do
            gh pr comment "$n" --body "This PR's data is carried into #$PR ($M). Merging #$PR accepts it too; this PR's model decision is unaffected. Close this PR once #$PR is merged."
          done
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          { echo "### Candidate $M: #$PR ${LABEL#candidate-}"; cat gate.txt; } >> "$GITHUB_STEP_SUMMARY"

      # A candidate is only useful if it can pass branch protection. GitHub
      # creates the pull_request `ci` run for a GITHUB_TOKEN-opened PR but holds
      # it for approval; a force-pushed rebuild may get no run at all. Find the
      # run on the PR's head commit and say exactly what the human must do - or
      # fail, so a candidate with no CI path is red here, not discovered later.
      - name: Locate the candidate PR's required CI run
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.pr }}
        run: |
          SHA=$(gh api "repos/{owner}/{repo}/pulls/$PR" -q .head.sha)
          RUN=""
          for _ in $(seq 1 12); do
            RUN=$(gh api "repos/{owner}/{repo}/actions/workflows/ci.yml/runs?head_sha=$SHA&event=pull_request" \
                    -q '.workflow_runs[0] | select(. != null) | "\(.id) \(.status) \(.conclusion) \(.html_url)"')
            [ -n "$RUN" ] && break
            sleep 10
          done
          if [ -z "$RUN" ]; then
            MSG="No \`ci\` run exists for this PR's head \`$SHA\`, so its required check can never pass. Run \`gh api -X PUT repos/{owner}/{repo}/pulls/$PR/update-branch\` or push an empty commit as a human, then \`make candidate-ci BRANCH=retrain/$M\`."
            gh pr comment "$PR" --body "$MSG"
            echo "::error::$MSG"
            exit 1
          fi
          read -r _ STATUS CONCLUSION URL <<< "$RUN"
          if [ "$CONCLUSION" = "action_required" ]; then
            MSG="Required check \`ci\` for \`$SHA\`: run $URL is **held for approval** (GitHub requires it for PRs opened by \`GITHUB_TOKEN\`). Approving is the data-acceptance step: \`make candidate-ci BRANCH=retrain/$M\` approves, waits, and asserts the PR is CLEAN."
          else
            MSG="Required check \`ci\` for \`$SHA\`: run $URL is $STATUS ${CONCLUSION}."
          fi
          gh pr comment "$PR" --body "$MSG"
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the model-drift issue
        if: steps.prospective.outputs.verdict == 'degraded'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat prospective.txt
            echo
            echo "See reports/monitoring/$M.json on branch retrain/$M. Threshold: ADR-0011."
          } > drift.md
          N=$(gh issue list --state open --label model-drift --search "\"Model drift on $M\" in:title" --json number -q '.[0].number')
          if [ -n "$N" ]; then
            gh issue comment "$N" --body-file drift.md
          else
            gh issue create --title "Model drift on $M" --body-file drift.md --label model-drift
          fi
