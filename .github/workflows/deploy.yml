name: deploy

# Deploys when the champion pointer changes on main (promotion or rollback),
# or by hand. Fetches the champion's artefacts from the DVC remote (S3) at the
# champion's commit, builds the image, pushes to ECR, updates Lambda, and runs
# deploy_check against the Function URL. A failed check fails the workflow;
# rollback is `make rollback REASON=...` + push (docs/runbook.md).

on:
  push:
    branches: [main]
    paths:
      - models/champion.json        # the pointer: promote or rollback
      - models/champion_meta.json   # the champion's feature list; also baked in
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # OIDC -> AWS_ROLE_ARN, no long-lived keys

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # fetch_champion.py reads models/model_meta.json at the champion sha

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: make setup

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Read champion
        id: champ
        run: |
          echo "version=v$(jq -r .version models/champion.json)" >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -r .git_sha models/champion.json)" >> "$GITHUB_OUTPUT"

      - name: Fetch champion artefacts from the DVC remote (S3)
        run: uv run python scripts/fetch_champion.py

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: ${{ secrets.ECR_REPOSITORY }}
        run: |
          IMAGE="$REGISTRY/$REPO"
          # Lambda rejects OCI manifests, so buildx must emit Docker v2 media
          # types: --provenance=false --sbom=false + oci-mediatypes=false.
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
            --output type=image,oci-mediatypes=false,push=true \
            --build-arg MODELS_SRC=build/champion/models \
            --build-arg REFERENCE_SRC=build/champion/reference \
            --build-arg GIT_SHA=${{ github.sha }} \
            --build-arg MODEL_VERSION=${{ steps.champ.outputs.version }} \
            -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:${{ steps.champ.outputs.version }}" .
          echo "IMAGE_URI=$IMAGE:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Update Lambda and wait
        run: |
          aws lambda update-function-code --function-name "${{ secrets.LAMBDA_FUNCTION_NAME }}" --image-uri "$IMAGE_URI" >/dev/null
          aws lambda wait function-updated --function-name "${{ secrets.LAMBDA_FUNCTION_NAME }}"

      - name: Diagnose URL auth (temporary)
        run: |
          echo "caller: $(aws sts get-caller-identity --query Arn --output text)"
          aws lambda get-function-url-config --function-name "${{ secrets.LAMBDA_FUNCTION_NAME }}" \
            --query '{auth:AuthType,url:FunctionUrl}' --output json
          uv run python - <<'PY'
          import os, json, urllib.request, urllib.error
          import boto3
          from botocore.auth import SigV4Auth
          from botocore.awsrequest import AWSRequest
          url = os.environ["URL"].rstrip("/") + "/health"
          s = boto3.Session()
          c = s.get_credentials().get_frozen_credentials()
          print("has token:", bool(c.token), "region:", s.region_name)
          req = AWSRequest(method="GET", url=url, headers={"host": url.split("/")[2]})
          SigV4Auth(s.get_credentials(), "lambda", s.region_name or "us-east-1").add_auth(req)
          print("signed headers:", sorted(dict(req.headers)))
          try:
              with urllib.request.urlopen(
                  urllib.request.Request(url, headers=dict(req.headers)), timeout=60
              ) as r:
                  print("HTTP", r.status, r.read()[:200])
          except urllib.error.HTTPError as e:
              print("HTTP", e.code, e.read()[:300])
              print("headers:", dict(e.headers))
          PY
        env:
          URL: ${{ secrets.FUNCTION_URL }}

      - name: Deploy check (version, fixture prediction, malformed -> 422, cold start)
        run: |
          uv run python scripts/deploy_check.py --url "${{ secrets.FUNCTION_URL }}" --sigv4 \
            --expect-version ${{ steps.champ.outputs.version }} \
            --models-dir build/champion/models --reference-dir build/champion/reference \
            --malformed --cold --n 5
